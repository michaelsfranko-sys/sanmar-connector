services:
  - type: web
    name: sanmar-connector
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn combined:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SANMAR_SFTP_HOST
        value: ftp.sanmar.com
      - key: SANMAR_SFTP_PORT
        value: "2200"
      - key: SANMAR_SFTP_USERNAME
        sync: false
      - key: SANMAR_SFTP_PASSWORD
        sync: false
      - key: SANMAR_EPDD_REMOTE_PATH
        value: /SanMar_EPDD.csv
      - key: SANMAR_DIP_REMOTE_PATH
        value: /sanmar_dip.txt
      - key: SANMAR_CACHE_DIR
        value: /tmp/sanmar
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
      - key: SHOPIFY_DEFAULT_STORE
        value: quality-image
      - key: QUALITY_IMAGE_SHOPIFY_STORE_DOMAIN
        sync: false
      - key: QUALITY_IMAGE_SHOPIFY_CLIENT_ID
        sync: false
      - key: QUALITY_IMAGE_SHOPIFY_CLIENT_SECRET
        sync: false
      - key: PRESTIGE_SHOPIFY_STORE_DOMAIN
        sync: false
      - key: PRESTIGE_SHOPIFY_CLIENT_ID
        sync: false
      - key: PRESTIGE_SHOPIFY_CLIENT_SECRET
        sync: false
      - key: CONNECTOR_API_KEY
        sync: false
