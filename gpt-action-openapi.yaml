openapi: 3.1.0
info:
  title: SanMar Connector
  version: 1.2.0
  description: Search cached SanMar product, pricing, image, and inventory data using compact responses suitable for GPT Actions.
servers:
  - url: https://sanmar-connector.onrender.com
paths:
  /product-overview/{style}:
    get:
      operationId: getSanMarProductOverview
      summary: Get a compact SanMar product overview with colors, sizes, price ranges, images, and inventory totals
      parameters:
        - name: style
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compact product overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  style:
                    type: string
                  title:
                    type: [string, 'null']
                  brand:
                    type: [string, 'null']
                  category:
                    type: [string, 'null']
                  subcategory:
                    type: [string, 'null']
                  description:
                    type: [string, 'null']
                  product_status:
                    type: [string, 'null']
                  variant_count:
                    type: integer
                  color_count:
                    type: integer
                  colors:
                    type: array
                    items:
                      type: string
                  sizes:
                    type: array
                    items:
                      type: string
                  pricing:
                    type: object
                    properties:
                      piece_min:
                        type: [number, 'null']
                      piece_max:
                        type: [number, 'null']
                      case_min:
                        type: [number, 'null']
                      case_max:
                        type: [number, 'null']
                      msrp_min:
                        type: [number, 'null']
                      msrp_max:
                        type: [number, 'null']
                      map_min:
                        type: [number, 'null']
                      map_max:
                        type: [number, 'null']
                  total_inventory:
                    type: integer
                  inventory_by_color:
                    type: object
                    additionalProperties:
                      type: integer
                  images_by_color:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        front_model_image_url:
                          type: [string, 'null']
                        front_flat_image:
                          type: [string, 'null']
                        back_flat_image:
                          type: [string, 'null']
                        color_swatch_image:
                          type: [string, 'null']
                  spec_sheet:
                    type: [string, 'null']
                  decoration_spec_sheet:
                    type: [string, 'null']
                  product_measurements:
                    type: [string, 'null']
                required: [style, colors, sizes, pricing, total_inventory]
  /products/{style}:
    get:
      operationId: getSanMarProductsByFilter
      summary: Get detailed SanMar variants for a style. Use color and/or size filters to keep the response small.
      parameters:
        - name: style
          in: path
          required: true
          schema:
            type: string
        - name: color
          in: query
          required: false
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Matching product variants
          content:
            application/json:
              schema:
                type: object
                properties:
                  style:
                    type: string
                  count:
                    type: integer
                  variants:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductVariant'
                required: [style, count, variants]
  /inventory/{style}:
    get:
      operationId: getSanMarInventoryByFilter
      summary: Get SanMar inventory for a style. Prefer color and/or size filters for detailed inventory.
      parameters:
        - name: style
          in: path
          required: true
          schema:
            type: string
        - name: color
          in: query
          required: false
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: string
        - name: warehouse
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Inventory returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  style:
                    type: string
                  variants:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryVariant'
                required: [style, variants]
  /refresh-status:
    get:
      operationId: getSanMarRefreshStatus
      summary: Check status of the SanMar background data refresh
      responses:
        '200':
          description: Refresh status
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                  started_at:
                    type: [string, 'null']
                  finished_at:
                    type: [string, 'null']
                  error:
                    type: [string, 'null']
                  current_file:
                    type: [string, 'null']
                  attempt:
                    type: integer
                  epdd_cached:
                    type: boolean
                  dip_cached:
                    type: boolean
                  cache_dir:
                    type: string
                  epdd_exists:
                    type: boolean
                  dip_exists:
                    type: boolean
                  epdd_size_bytes:
                    type: integer
                  dip_size_bytes:
                    type: integer
                  epdd_partial_bytes:
                    type: integer
                  dip_partial_bytes:
                    type: integer
  /health:
    get:
      operationId: getSanMarHealth
      summary: Check whether SanMar connector data is cached and available
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  cache_dir:
                    type: string
                  epdd_cached:
                    type: boolean
                  dip_cached:
                    type: boolean
                required: [status, epdd_cached, dip_cached]
components:
  schemas:
    ProductVariant:
      type: object
      properties:
        unique_key:
          type: [string, 'null']
        style:
          type: [string, 'null']
        title:
          type: [string, 'null']
        description:
          type: [string, 'null']
        brand:
          type: [string, 'null']
        category:
          type: [string, 'null']
        subcategory:
          type: [string, 'null']
        color:
          type: [string, 'null']
        size:
          type: [string, 'null']
        qty_epdd:
          type: [string, 'null']
        piece_price:
          type: [string, 'null']
        case_price:
          type: [string, 'null']
        suggested_price:
          type: [string, 'null']
        msrp:
          type: [string, 'null']
        map_pricing:
          type: [string, 'null']
        product_status:
          type: [string, 'null']
        inventory_key:
          type: [string, 'null']
        size_index:
          type: [string, 'null']
        gtin:
          type: [string, 'null']
        front_model_image_url:
          type: [string, 'null']
        color_product_image:
          type: [string, 'null']
        front_flat_image:
          type: [string, 'null']
        back_flat_image:
          type: [string, 'null']
        color_swatch_image:
          type: [string, 'null']
        spec_sheet:
          type: [string, 'null']
        decoration_spec_sheet:
          type: [string, 'null']
        product_measurements:
          type: [string, 'null']
        pms_color:
          type: [string, 'null']
        total_inventory:
          type: integer
    InventoryVariant:
      type: object
      properties:
        style:
          type: [string, 'null']
        color:
          type: [string, 'null']
        size:
          type: [string, 'null']
        unique_key:
          type: [string, 'null']
        piece_price:
          type: [string, 'null']
        case_price:
          type: [string, 'null']
        discontinued_code:
          type: [string, 'null']
        total_quantity:
          type: integer
        warehouses:
          type: array
          items:
            type: object
            properties:
              warehouse:
                type: [string, 'null']
              quantity:
                type: integer
