openapi: 3.1.0
info:
  title: SanMar + Shopify Connector
  version: 1.5.1
  description: Search SanMar, create and update Shopify drafts, generate mockups, and attach approved images.
servers:
  - url: https://sanmar-connector.onrender.com
paths:
  /product-overview/{style}:
    get:
      operationId: getSanMarProductOverview
      summary: Get SanMar product colors, sizes, pricing, images, and inventory totals
      parameters:
        - name: style
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  style: { type: string }
                  title: { type: [string, 'null'] }
                  colors: { type: array, items: { type: string } }
                  sizes: { type: array, items: { type: string } }
                  pricing: { type: object, additionalProperties: true }
                  total_inventory: { type: integer }
                  images_by_color: { type: object, additionalProperties: true }
                required: [style, colors, sizes, pricing, total_inventory]
  /products/{style}:
    get:
      operationId: getSanMarProductsByFilter
      summary: Get detailed SanMar variants using optional color and size filters
      parameters:
        - name: style
          in: path
          required: true
          schema: { type: string }
        - name: color
          in: query
          required: false
          schema: { type: string }
        - name: size
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Matching variants
          content:
            application/json:
              schema:
                type: object
                properties:
                  style: { type: string }
                  count: { type: integer }
                  variants: { type: array, items: { type: object, additionalProperties: true } }
                required: [style, count, variants]
  /inventory/{style}:
    get:
      operationId: getSanMarInventoryByFilter
      summary: Get SanMar inventory with optional color, size, and warehouse filters
      parameters:
        - name: style
          in: path
          required: true
          schema: { type: string }
        - name: color
          in: query
          required: false
          schema: { type: string }
        - name: size
          in: query
          required: false
          schema: { type: string }
        - name: warehouse
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Inventory results
          content:
            application/json:
              schema:
                type: object
                properties:
                  style: { type: string }
                  variants: { type: array, items: { type: object, additionalProperties: true } }
                required: [style, variants]
  /health:
    get:
      operationId: getSanMarHealth
      summary: Check SanMar connector cache health
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  epdd_cached: { type: boolean }
                  dip_cached: { type: boolean }
                required: [status, epdd_cached, dip_cached]
  /shopify/health:
    get:
      operationId: getShopifyConnectorHealth
      summary: Verify Shopify connection and scopes
      responses:
        '200':
          description: Shopify health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  shop_name: { type: string }
                  myshopify_domain: { type: string }
                  access_scopes: { type: array, items: { type: string } }
                required: [status, shop_name, myshopify_domain]
  /shopify/import-sanmar-draft:
    post:
      operationId: importSanMarDraftToShopify
      summary: Create an approved SanMar product as a Shopify DRAFT
      description: Use only after the user approves the style, colors, and sizes. Always create as DRAFT.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                style: { type: string }
                colors: { type: array, minItems: 1, items: { type: string } }
                sizes: { type: array, minItems: 1, items: { type: string } }
                retail_price: { type: [number, 'null'], minimum: 0 }
                title: { type: [string, 'null'] }
                tags: { type: array, items: { type: string } }
                confirm: { type: boolean }
                allow_duplicate: { type: boolean, default: false }
              required: [style, colors, sizes, confirm]
      responses:
        '200':
          description: Draft created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  product_id: { type: string }
                  admin_url: { type: string }
                  sanmar_style: { type: string }
                  variant_count: { type: integer }
                required: [status, product_id, admin_url, sanmar_style]
        '409': { description: Product already exists }
  /shopify/update-sanmar-draft:
    post:
      operationId: updateExistingSanMarDraft
      summary: Add or replace variants on an existing SanMar Shopify DRAFT
      description: Use add to preserve variants. Use replace only after explicit approval because omitted variants can be removed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                style: { type: string }
                colors: { type: array, minItems: 1, items: { type: string } }
                sizes: { type: array, minItems: 1, items: { type: string } }
                mode: { type: string, enum: [add, replace], default: add }
                retail_price: { type: [number, 'null'], minimum: 0 }
                confirm: { type: boolean }
              required: [style, colors, sizes, mode, confirm]
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  mode: { type: string }
                  product_id: { type: string }
                  admin_url: { type: string }
                  sanmar_style: { type: string }
                required: [status, mode, product_id, admin_url, sanmar_style]
  /shopify/create-mockup:
    post:
      operationId: createSanMarProductMockup
      summary: Create a product mockup from a SanMar garment image and approved artwork URL
      description: Generate a deterministic mockup without redrawing the artwork. Attach to Shopify only after user approval.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                style: { type: string, description: SanMar style such as K500 }
                color: { type: string }
                artwork_url: { type: string, format: uri, description: Public PNG artwork URL; transparent background preferred }
                placement: { type: string, enum: [left_chest, center_chest, full_front], default: left_chest }
                scale: { type: number, minimum: 0.5, maximum: 1.5, default: 1.0 }
                attach_to_shopify: { type: boolean, default: false }
                confirm_attach: { type: boolean, default: false }
                alt_text: { type: [string, 'null'] }
              required: [style, color, artwork_url, placement]
      responses:
        '200':
          description: Mockup created and optionally attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  style: { type: string }
                  color: { type: string }
                  placement: { type: string }
                  mockup_url: { type: string }
                  attached_to_shopify: { type: boolean }
                  product_id: { type: [string, 'null'] }
                  admin_url: { type: [string, 'null'] }
                required: [status, style, color, placement, mockup_url, attached_to_shopify]
  /shopify/attach-image:
    post:
      operationId: attachImageUrlToSanMarProduct
      summary: Attach an approved public image URL to an existing SanMar Shopify product
      description: Use for approved mockups or other product images. Set confirm true only after user approval.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                style: { type: string }
                image_url: { type: string, format: uri }
                alt_text: { type: [string, 'null'] }
                confirm: { type: boolean }
              required: [style, image_url, confirm]
      responses:
        '200':
          description: Image attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  product_id: { type: string }
                  admin_url: { type: string }
                  image_url: { type: string }
                required: [status, product_id, admin_url, image_url]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas: {}
